name: Portal CI

on:
  push:
    branches: ['**']
    paths:
      - 'portal/**'
      - '.github/workflows/portal-ci.yml'
  pull_request:
    paths:
      - 'portal/**'
      - '.github/workflows/portal-ci.yml'

jobs:
  server:
    name: Server (typecheck, lint, test, build)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cep_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cep_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cep_test
      JWT_SECRET: ci-test-secret
    defaults:
      run:
        working-directory: portal/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: portal/server/package-lock.json
      - run: npm ci
      - run: npm run prisma:generate
      - name: Apply migrations to test DB
        run: npx prisma migrate deploy
      - name: Seed test DB (for importer DB tests)
        run: npm run seed
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  client:
    name: Client (typecheck, lint, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portal/client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: portal/client/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: client-dist
          path: portal/client/dist
          retention-days: 7
